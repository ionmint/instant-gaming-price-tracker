name: Add product

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL del prodotto Instant Gaming da tracciare"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python tracker.py add "${{ github.event.inputs.url }}"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "chore: add tracked product"
          git push
