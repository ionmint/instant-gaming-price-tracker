name: Remove product

on:
  workflow_dispatch:
    inputs:
      identifier:
        description: "SKU, URL o nome (anche parziale) del prodotto da rimuovere"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python tracker.py remove "${{ github.event.inputs.identifier }}"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "chore: remove tracked product"
          git push
